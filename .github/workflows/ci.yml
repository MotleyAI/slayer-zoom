name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix web
      - name: Tests
        run: uv run pytest -q
      - name: Web tests
        run: npm test --prefix web
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type check (against baseline)
        run: uvx --no-build --from living-architecture==0.13.0 la-typecheck
      - name: Architecture (import law and principles)
        run: uvx --no-build --from living-architecture==0.13.0 la-arch-check
      - name: LikeC4 model
        run: npx -y likec4@1 validate architecture
      - name: Web build
        run: npm run build --prefix web

format: 0.4.0
tracker: github
openspec: true
architecture: true
reviewers:
  codex: false
issue_key_pattern: "#\\d+"
commands:
  test: uv run pytest -q && npm test --prefix web
  lint: uv run ruff check src tests && uv run ruff format --check src tests
  typecheck:
    python: uv run basedpyright
    typescript: web/node_modules/.bin/tsc -p web --noEmit
